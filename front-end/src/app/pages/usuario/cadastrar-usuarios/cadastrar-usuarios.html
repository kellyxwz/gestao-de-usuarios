<section class="card">
  <header class="card-header">
    <h3>Novo usuário</h3>
  </header>

  <form class="formulario" [formGroup]="form" (ngSubmit)="cadastrarUsuario()">
    <div class="campo">
      <label for="nome-usuario">Nome completo</label>
      <input
        id="nome-usuario"
        type="text"
        formControlName="name"
        placeholder="Ex.: Maria Silva"
        [class.campo-invalido]="
          form.get('name')?.touched &&
          form.get('name')?.hasError('required')
        "
      />
    </div>

    <div class="campo">
      <label for="email-usuario">E-mail</label>
      <input
        id="email-usuario"
        type="email"
        formControlName="email"
        placeholder="nome@exemplo.com"
        [class.campo-invalido]="
          form.get('email')?.touched &&
          (form.get('email')?.hasError('required') ||
          form.get('email')?.hasError('email'))
        "
      />
      <div class="mensagem-erro" aria-live="polite">
        @if (form.get('email')?.touched && form.get('email')?.hasError('email')) {
          <span>E-mail com formato inválido.</span>
        } @else if (form.get('email')?.hasError('emailCadastrado')) {
          <span>E-mail já cadastrado.</span>
        }
      </div>
    </div>

    <div class="campo">
      <label for="perfil-usuario">Perfil</label>
      <select
          id="perfil-usuario"
          formControlName="role"
          [class.campo-invalido]="
            form.get('role')?.touched &&
            form.get('role')?.hasError('required')
          "
      >
        <option value="" selected disabled>Selecione</option>
        <option value="USER">Usuário</option>
        <option value="ADMIN">Administrador</option>
      </select>
    </div>

    <footer class="acoes">
      <button type="button" class="botao-cancelar" (click)="cancelar.emit()">
        Cancelar
      </button>
      <button type="submit" class="botao-adicionar" (click)="cancelar.emit()">
        + Adicionar usuário
      </button>
    </footer>

    @if (form.invalid && form.touched) {
      <small class="mensagem-formulario">
        Preencha todos os campos obrigatórios.
      </small>
    }
  </form>
</section>
